name: github-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    permissions:
      contents: read
      security-events: write  # CodeQL publishes results evaluated by the local gate.
    uses: ./.github/workflows/go.yml
    with:
      profile: go-strict
