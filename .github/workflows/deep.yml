          GO_PLAN_PATH: ${{ runner.temp }}/github-ci-plan/go-plan.json
          SOURCE_DIR: ${{ github.workspace }}/source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/github-ci-bin:$PATH"
          gitleaks git --no-banner --redact=100 "$SOURCE_DIR"
          source "$CENTRAL_DIR/scripts/load-go-plan.sh"
          load_go_modules "$GO_PLAN_PATH"
          for index in "${!GO_PLAN_MODULE_PATHS[@]}"; do
            directory="$SOURCE_DIR"
            [[ "${GO_PLAN_MODULE_DIRECTORIES[$index]}" == "." ]] || directory="$SOURCE_DIR/${GO_PLAN_MODULE_DIRECTORIES[$index]}"
            updates=$(
              cd "$directory"
              module_file=$(go mod edit -json)
              dependencies=()
              while IFS= read -r dependency; do
                [[ -z "$dependency" ]] || dependencies+=("$dependency")
              done < <(jq -r '.Require[]?.Path' <<< "$module_file")
              if (( ${#dependencies[@]} == 0 )); then
                printf '0\n'
              else
                go list -m -u -json "${dependencies[@]}" | jq -s '[.[] | select(.Update != null)] | length'
              fi
            )
            [[ "$updates" == 0 ]]
