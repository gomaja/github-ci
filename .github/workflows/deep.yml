  history-refresh:
    name: history and dependency refresh
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
