version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: deps
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:47"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - "*"
