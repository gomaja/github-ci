schema-version: 2
api-version: "2026-03-10"
owners:
  - name: gomaja
    type: user
defaults:
  profile: go-strict
  default-branch: main
  required-checks:
    - github-ci / gate
  public-only: true
  refuse-forks: true
  refuse-archived: true
  refuse-private: true
  refuse-unexpected-owners: true
repositories:
  - name: github-ci
    owner: gomaja
    enforce-caller: false
  - name: go-sctp
    owner: gomaja
    profile: go-library
    go:
      defaults:
        packages: [./...]
        module-mode: readonly
        build-tags: [integration]
        test-timeout: 10m
        package-parallelism: 4
        race-parallelism: 1
        coverage-packages: [./...]
    enforce-caller: true
    workflow-sha: 0123456789abcdef0123456789abcdef01234567
    observed-required-checks:
      - github-ci / gate
