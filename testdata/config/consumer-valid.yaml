schema-version: 2
profile: go-strict
go:
  defaults:
    packages: [./...]
    module-mode: readonly
    build-tags: [integration]
    test-timeout: 10m
    package-parallelism: 4
    race-parallelism: 1
    coverage-packages: [./...]
  modules:
    - path: .
    - path: tools
generated-paths:
  - internal/generated
exceptions: .github/github-ci-exceptions.yaml
