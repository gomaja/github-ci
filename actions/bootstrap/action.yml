name: Bootstrap github-ci
description: Build the workflow-bound policy CLI and install immutable Go analyzers.
inputs:
  go-version:
    description: Go toolchain version.
    required: true
  install-tools:
    description: Install Go analyzers used by producer jobs.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: Build policy CLI
      shell: bash
      env:
        CENTRAL_DIR: ${{ github.action_path }}/../..
        BIN_DIR: ${{ runner.temp }}/github-ci-bin
      run: |
        set -euo pipefail
        mkdir -p "$BIN_DIR"
        (cd "$CENTRAL_DIR" && go build -trimpath -o "$BIN_DIR/github-ci" ./cmd/github-ci)
    - name: Install immutable Go analyzers
      if: ${{ inputs.install-tools == 'true' }}
      shell: bash
      env:
        BIN_DIR: ${{ runner.temp }}/github-ci-bin
      run: |
        set -euo pipefail
        GOBIN="$BIN_DIR" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
        GOBIN="$BIN_DIR" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        GOBIN="$BIN_DIR" go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
        GOBIN="$BIN_DIR" go install golang.org/x/tools/gopls@v0.23.0
        GOBIN="$BIN_DIR" go install golang.org/x/tools/cmd/goimports@v0.49.0
        GOBIN="$BIN_DIR" go install gotest.tools/gotestsum@v1.13.0
        GOBIN="$BIN_DIR" go install github.com/boumenot/gocover-cobertura@v1.5.0
        "$BIN_DIR/golangci-lint" version | grep -F '2.13.0'
        "$BIN_DIR/govulncheck" -version | grep -F 'govulncheck@v1.7.0'
        "$BIN_DIR/staticcheck" -version | grep -F '2026.2rc1 (0.8.0-rc.1)'
        "$BIN_DIR/gopls" version | grep -F 'v0.23.0'
        go version -m "$BIN_DIR/goimports" | grep -F $'mod\tgolang.org/x/tools\tv0.49.0'
        "$BIN_DIR/gotestsum" --version | grep -F 'v1.13.0'
        go version -m "$BIN_DIR/gocover-cobertura" | grep -F $'mod\tgithub.com/boumenot/gocover-cobertura\tv1.5.0'
