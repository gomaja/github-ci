# Code generated from templates/configs/golangci.yml.tmpl; DO NOT EDIT.
version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - zerologlint

  settings:
    cyclop:
      max-complexity: 20
    depguard:
      rules:
        main:
          list-mode: original
          deny:
            - pkg: github.com/pkg/errors$
              desc: use the standard library errors package
            - pkg: github.com/satori/go.uuid$
              desc: use github.com/google/uuid
            - pkg: gopkg.in/yaml.v2$
              desc: use gopkg.in/yaml.v3
            - pkg: io/ioutil$
              desc: use the corresponding os or io package API
    gocognit:
      min-complexity: 30
    goconst:
      ignore-tests: true
    recvcheck:
      exclusions:
        - "*.UnmarshalJSON"
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
